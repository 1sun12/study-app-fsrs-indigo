[package]
name = "indigo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Indigo's commands as JSON in, JSON out, for scripts and AI harnesses."

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
indigo-core = { path = "../core" }
serde = "1.0.229"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
