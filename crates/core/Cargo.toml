# Package is `indigo-core`, not `core`: a crate named `core` shadows the
# standard library's `core` in dependents and breaks derive-macro output.
[package]
name = "indigo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Indigo core: domain, scoring, scheduling, vault. No Tauri dependencies."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
fsrs = "=7.0.0"
imagesize = "0.15.0"
infer = "0.22.0"
log = "0.4"
png = "0.18.1"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
